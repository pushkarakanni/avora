<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Avora &amp; Crazy Heads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <!-- ═══════════════════ SIDEBAR ═══════════════════ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-logo">
                <span class="sidebar-logo-a">A</span>
                <div class="sidebar-logo-text">
                    <span class="slabel">Admin Panel</span>
                    <span class="sbrand">Avora Group</span>
                </div>
            </div>
        </div>

        <nav class="sidebar-nav">

            <!-- Avora -->
            <div class="sidebar-brand-section">
                <div class="sidebar-section-label avora-label">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    Avora Experiences
                </div>
                <ul class="sidebar-items">
                    <li>
                        <button class="sidebar-item" data-section="avora-enquiries">
                            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            <span>Event Enquiries</span>
                            <span class="si-badge avora-badge" id="badge-avora-enquiries">0</span>
                        </button>
                    </li>
                </ul>
            </div>

            <div class="sidebar-divider"></div>

            <!-- Crazy Heads -->
            <div class="sidebar-brand-section">
                <div class="sidebar-section-label ch-label">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    Crazy Heads
                </div>
                <ul class="sidebar-items">
                    <li>
                        <button class="sidebar-item" data-section="ch-tickets">
                            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v2z"/></svg>
                            <span>Ticket Bookings</span>
                            <span class="si-badge ch-badge" id="badge-ch-tickets">0</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-item" data-section="ch-partners">
                            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            <span>College Partners</span>
                            <span class="si-badge ch-badge" id="badge-ch-partners">0</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-item" data-section="ch-ambassadors">
                            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <span>Ambassadors</span>
                            <span class="si-badge ch-badge" id="badge-ch-ambassadors">0</span>
                        </button>
                    </li>
                    <li>
                        <button class="sidebar-item" data-section="ch-events">
                            <svg class="si-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            <span>Events</span>
                            <span class="si-badge ch-badge" id="badge-ch-events">0</span>
                        </button>
                    </li>
                </ul>
            </div>

        </nav>

        <div class="sidebar-footer">
            <a href="../website/avora.html" class="sf-link avora-sf" target="_blank">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                Avora Site ↗
            </a>
            <a href="../website/crazyheads.html" class="sf-link ch-sf" target="_blank">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                Crazy Heads Site ↗
            </a>
        </div>
    </aside>

    <!-- ═══════════════════ MAIN ═══════════════════════ -->
    <div class="main-wrap">

        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                    <span></span><span></span><span></span>
                </button>
                <div class="topbar-title-wrap">
                    <h1 class="topbar-title" id="topbarTitle">Select a section</h1>
                    <span class="topbar-count" id="topbarCount"></span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="view-toggle" id="viewToggle">
                    <button class="vt-btn active" data-view="table">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                        Table
                    </button>
                    <button class="vt-btn" data-view="cards">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                        Cards
                    </button>
                </div>
                <button class="export-btn" id="exportBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Export CSV
                </button>
            </div>
        </header>

        <!-- Content -->
        <main class="content-area" id="contentArea">

            <!-- Events toolbar (shown only for ch-events section) -->
            <div class="events-toolbar" id="eventsToolbar" style="display:none">
                <div class="evt-filters">
                    <button class="evt-chip active" data-filter="">All</button>
                    <button class="evt-chip" data-filter="past">Past</button>
                    <button class="evt-chip" data-filter="present">Present</button>
                    <button class="evt-chip" data-filter="upcoming">Upcoming</button>
                </div>
                <button class="add-event-btn" id="addEventBtn">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    New Event
                </button>
            </div>

            <!-- Empty state -->
            <div class="empty-state" id="emptyState">
                <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <p>Select a section from the sidebar</p>
            </div>

            <!-- Table view wrapper -->
            <div class="table-wrap" id="tableWrap" style="display:none">
                <div class="table-scroll">
                    <table class="data-table" id="dataTable">
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div class="no-data" id="noDataMsg" style="display:none">No submissions yet.</div>
            </div>

            <!-- Cards view wrapper -->
            <div class="cards-grid" id="cardsGrid" style="display:none"></div>

        </main>
    </div>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="js/firebase-init.js"></script>

    <!-- ═══════════════════ LOGIN SCREEN ════════════════════ -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-logo">
                <span class="login-logo-a">A</span>
                <div>
                    <p class="login-label">Admin Panel</p>
                    <p class="login-brand">Avora Group</p>
                </div>
            </div>
            <h2 class="login-title">Sign In</h2>
            <p class="login-sub">Enter your admin credentials to continue</p>
            <div class="login-fields">
                <input type="email"    id="loginEmail"    class="login-input" placeholder="Email address" autocomplete="email" />
                <input type="password" id="loginPassword" class="login-input" placeholder="Password" autocomplete="current-password" />
                <p class="login-error" id="loginError"></p>
            </div>
            <button class="login-btn" id="loginBtn">Sign In →</button>
        </div>
    </div>

    <!-- ═══════════════════ EVENT CRUD MODAL ══════════════════ -->
    <div class="admin-modal-overlay" id="eventModalOverlay">
        <div class="admin-modal">
            <div class="am-header">
                <h3 class="am-title" id="amTitle">New Event</h3>
                <button class="am-close" id="amClose">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="am-body">
                <input type="hidden" id="amDocId" />
                <div class="am-two-col">
                    <div class="am-field">
                        <label class="am-label">Event Name *</label>
                        <input class="am-input" id="amName" placeholder="e.g. Electric Dreams" />
                    </div>
                    <div class="am-field">
                        <label class="am-label">Subtitle</label>
                        <input class="am-input" id="amSubname" placeholder="e.g. Open Air Festival" />
                    </div>
                </div>
                <div class="am-two-col">
                    <div class="am-field">
                        <label class="am-label">Date</label>
                        <input class="am-input" id="amDate" placeholder="e.g. Apr 25–26, 2025" />
                    </div>
                    <div class="am-field">
                        <label class="am-label">Status *</label>
                        <select class="am-input am-select" id="amStatus">
                            <option value="upcoming">Upcoming</option>
                            <option value="present">Present / Live</option>
                            <option value="past">Past / Ended</option>
                        </select>
                    </div>
                </div>
                <div class="am-two-col">
                    <div class="am-field">
                        <label class="am-label">Venue</label>
                        <input class="am-input" id="amVenue" placeholder="e.g. KTPO Ground, Bangalore" />
                    </div>
                    <div class="am-field">
                        <label class="am-label">Genre / Music</label>
                        <input class="am-input" id="amGenre" placeholder="e.g. Electronic · Techno · House" />
                    </div>
                </div>
                <div class="am-two-col">
                    <div class="am-field">
                        <label class="am-label">Capacity / Attendance</label>
                        <input class="am-input" id="amCapacity" type="number" placeholder="e.g. 5000" />
                    </div>
                    <div class="am-field">
                        <label class="am-label">Status Tag Label</label>
                        <input class="am-input" id="amStatusLabel" placeholder="e.g. LIVE NOW, THIS WEEKEND" />
                    </div>
                </div>
                <div class="am-two-col">
                    <div class="am-field">
                        <label class="am-label">Normal Price (₹)</label>
                        <input class="am-input" id="amNormal" type="number" placeholder="e.g. 1999" />
                    </div>
                    <div class="am-field">
                        <label class="am-label">Premium Price (₹)</label>
                        <input class="am-input" id="amPremium" type="number" placeholder="e.g. 3499" />
                    </div>
                </div>
                <div class="am-two-col">
                    <div class="am-field">
                        <label class="am-label">Luxury Price (₹)</label>
                        <input class="am-input" id="amLuxury" type="number" placeholder="e.g. 5999" />
                    </div>
                    <div class="am-field">
                        <label class="am-label">Stub Number</label>
                        <input class="am-input" id="amStub" placeholder="e.g. #CH009" />
                    </div>
                </div>
                <p class="am-error" id="amError"></p>
            </div>
            <div class="am-footer">
                <button class="am-cancel" id="amCancel">Cancel</button>
                <button class="am-save" id="amSave">Save Event →</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
